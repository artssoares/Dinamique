name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Job-wide, because `pnpm run test` runs the database package too – not
    # just the dedicated step further down. Without these it probes 54322,
    # the port `supabase start` uses locally, and fails the whole run.
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. The action refuses to start when the
      # version is pinned in two places, and package.json's `packageManager`
      # is the one that also governs local installs – so that stays the single
      # source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      # `! comando` é isento do `set -e` do bash: a inversão vira o status da
      # linha e o script segue em frente, então só a ÚLTIMA linha de um bloco
      # como este chegava a reprovar o job. As três verificações abaixo já
      # existiam nesse formato — na prática, duas delas nunca falhavam.
      - name: Security sweep
        run: |
          fail() { echo "FALHOU: $1"; exit 1; }

          echo "Nenhuma chave de serviço pode existir no aplicativo cliente."
          grep -rn "SERVICE_ROLE" apps/mobile/src apps/mobile/app packages/ 2>/dev/null \
            && fail "chave de serviço no cliente"

          echo "Nenhum .env real pode estar versionado."
          git ls-files | grep -qE '\.env$|\.env\.local$' && fail ".env versionado"

          echo "Nenhum hex de cor fora dos tokens de design."
          grep -rnE '#[0-9a-fA-F]{6}' apps/mobile/app apps/mobile/src 2>/dev/null \
            && fail "hex de cor fora dos tokens"

          echo "Varredura de segurança OK."
          exit 0

      - name: Database migrations and security assertions
        run: pnpm --filter @dinamique/database test

      # Building is what catches monorepo resolution problems that typecheck
      # cannot see – see the .npmrc comment about React hoisting.
      - name: Build admin
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
          SUPABASE_SERVICE_ROLE_KEY: ci
        run: pnpm --filter @dinamique/admin build

      # `dist` rather than /tmp: Expo refuses to write outside the project –
      # "CommandError: --output-dir must be a subdirectory of the project
      # directory" – so the old path failed before bundling anything. `dist`
      # is already gitignored.
      #
      # `--clear` porque é o que o vercel.json usa, e os dois não podem
      # divergir: o passo seguinte só prova alguma coisa se este for o mesmo
      # comando que constrói o site de verdade.
      - name: Bundle mobile for web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          EXPO_PUBLIC_ARCGIS_API_KEY: ci-arcgis-key
        run: pnpm --filter @dinamique/mobile exec expo export --platform web --output-dir dist --clear

      # O bug que este passo existe para pegar já foi para produção e ficou lá.
      #
      # O Metro substitui `process.env.EXPO_PUBLIC_*` na hora de transformar o
      # arquivo, mas o VALOR não entra na chave do cache de transformação. Com
      # o Build Cache da Vercel ligado, toda construção seguinte reaproveitava
      # o `supabase.ts` transformado da primeira, que não tinha chave nenhuma.
      # O site subia "com sucesso", e o aplicativo abria na tela "Falta
      # conectar o banco de dados" com o mapa desligado junto.
      #
      # Um export que passa não prova nada sobre isso: as três chaves ausentes
      # compilam perfeitamente. Só a busca no pacote pronto prova.
      - name: As chaves públicas entraram no pacote
        run: |
          fail() { echo "FALHOU: $1"; exit 1; }

          test -d apps/mobile/dist || fail "pacote web ausente"

          for chave in example.supabase.co ci-anon-key ci-arcgis-key; do
            grep -rq -- "$chave" apps/mobile/dist \
              || fail "$chave não foi embutida no pacote (cache do Metro reaproveitado?)"
          done
          echo "As três variáveis EXPO_PUBLIC chegaram ao pacote."

      # O export passar é só a prova negativa. Módulos nativos são mantidos fora
      # da web por extensão de plataforma (`.native.ts`), e um import distraído
      # em arquivo neutro os traria de volta sem quebrar o build — o app só
      # falharia no navegador do usuário. Isto afirma o contrário na marra.
      #
      # "maplibre-react-native" e não "maplibre": o replay na web usa de
      # propósito o `maplibre-gl` (a lib pura em JS/WebGL, sem módulo nativo
      # nenhum) para desenhar o mesmo mapa de rua que o app mostra no
      # aparelho. É só a ponte `@maplibre/maplibre-react-native` — importada
      # apenas por `RouteReplay.native.tsx`, que o Metro nunca resolve na web —
      # que não pode aparecer aqui.
      - name: Nenhum módulo nativo no pacote web
        run: |
          echo "A ponte nativa do MapLibre e o TaskManager não podem existir no navegador."
          # Um `grep` num diretório que não existe sai com 2, e `! grep` leria
          # isso como aprovação — a verificação passaria sem ter olhado nada.
          test -d apps/mobile/dist || { echo "FALHOU: pacote web ausente"; exit 1; }

          for modulo in maplibre-react-native expo-task-manager; do
            if grep -rq "$modulo" apps/mobile/dist; then
              echo "FALHOU: $modulo entrou no pacote web"
              exit 1
            fi
          done
          echo "Pacote web limpo."
