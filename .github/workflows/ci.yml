name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Job-wide, because `pnpm run test` runs the database package too – not
    # just the dedicated step further down. Without these it probes 54322,
    # the port `supabase start` uses locally, and fails the whole run.
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. The action refuses to start when the
      # version is pinned in two places, and package.json's `packageManager`
      # is the one that also governs local installs – so that stays the single
      # source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Security sweep
        run: |
          echo "Nenhuma chave de serviço pode existir no aplicativo cliente."
          ! grep -rn "SERVICE_ROLE" apps/mobile/src apps/mobile/app packages/ 2>/dev/null
          echo "Nenhum .env real pode estar versionado."
          ! git ls-files | grep -qE '\.env$|\.env\.local$'
          echo "Nenhum hex de cor fora dos tokens de design."
          ! grep -rnE '#[0-9a-fA-F]{6}' apps/mobile/app apps/mobile/src 2>/dev/null

      - name: Database migrations and security assertions
        run: pnpm --filter @dinamique/database test

      # Building is what catches monorepo resolution problems that typecheck
      # cannot see – see the .npmrc comment about React hoisting.
      - name: Build admin
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
          SUPABASE_SERVICE_ROLE_KEY: ci
        run: pnpm --filter @dinamique/admin build

      # `dist` rather than /tmp: Expo refuses to write outside the project –
      # "CommandError: --output-dir must be a subdirectory of the project
      # directory" – so the old path failed before bundling anything. `dist`
      # is already gitignored.
      - name: Bundle mobile for web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci
        run: pnpm --filter @dinamique/mobile exec expo export --platform web --output-dir dist
